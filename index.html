<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather.wales | Tywydd Cymru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f3f4f6; }
    .hourly-scroll::-webkit-scrollbar { height: 6px; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="text-gray-800">
  <!-- Top Nav -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🏴󠁧󠁢󠁷󠁬󠁳󠁿</span>
        <span class="text-xl font-bold text-blue-700">weather.wales</span>
      </div>
      <button onclick="toggleLang()" class="text-sm text-blue-600 font-medium hover:underline">
        <span id="langLabel">Cymraeg</span>
      </button>
    </div>
  </header>

  <!-- Search -->
  <div class="bg-white border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 py-4">
      <div class="relative">
        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input id="searchInput" type="text" placeholder="Search for a city or town..."
               class="w-full pl-12 pr-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
               oninput="filterCities()">
      </div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- Current Conditions -->
    <div id="current" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
      Loading current conditions...
    </div>

    <!-- Hourly -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
      <h3 class="font-semibold mb-4">Hourly Forecast</h3>
      <div id="hourly" class="hourly-scroll flex gap-4 overflow-x-auto pb-2"></div>
    </div>

    <!-- Map -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden mb-6">
      <div id="map" class="h-80"></div>
    </div>

    <!-- 10-Day style -->
    <div id="daily" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
      <h3 class="font-semibold mb-4">Forecast Across Wales</h3>
      <div id="weatherGrid" class="space-y-3"></div>
    </div>
  </main>

  <footer class="text-center py-6 text-xs text-gray-500">
    weather.wales • Data from Open-Meteo • Made for Cymru
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const cities = [
      { name: "Cardiff", nameCy: "Caerdydd", lat: 51.4816, lon: -3.1791 },
      { name: "Swansea", nameCy: "Abertawe", lat: 51.6214, lon: -3.9436 },
      { name: "Newport", nameCy: "Casnewydd", lat: 51.5842, lon: -2.9977 },
      { name: "Bangor", nameCy: "Bangor", lat: 53.2274, lon: -4.1293 },
      { name: "Aberystwyth", nameCy: "Aberystwyth", lat: 52.4153, lon: -4.0829 },
      { name: "Wrexham", nameCy: "Wrecsam", lat: 53.0430, lon: -2.9930 },
      { name: "Caernarfon", nameCy: "Caernarfon", lat: 53.1413, lon: -4.2702 },
      { name: "Llandudno", nameCy: "Llandudno", lat: 53.3240, lon: -3.8274 },
      { name: "Haverfordwest", nameCy: "Hwlffordd", lat: 51.8017, lon: -4.9691 },
      { name: "Carmarthen", nameCy: "Caerfyrddin", lat: 51.8560, lon: -4.3095 },
      { name: "Barry", nameCy: "Y Barri", lat: 51.3998, lon: -3.2838 },
      { name: "Bridgend", nameCy: "Pen-y-bont ar Ogwr", lat: 51.5045, lon: -3.5769 },
      { name: "Merthyr Tydfil", nameCy: "Merthyr Tudful", lat: 51.7476, lon: -3.3778 },
      { name: "Pontypridd", nameCy: "Pontypridd", lat: 51.6018, lon: -3.3421 },
      { name: "Caerphilly", nameCy: "Caerffili", lat: 51.5745, lon: -3.2180 },
      { name: "Brecon", nameCy: "Aberhonddu", lat: 51.9461, lon: -3.3886 },
      { name: "Cardigan", nameCy: "Aberteifi", lat: 52.0837, lon: -4.6602 },
      { name: "Tenby", nameCy: "Dinbych-y-pysgod", lat: 51.6728, lon: -4.7061 },
      { name: "Rhyl", nameCy: "Y Rhyl", lat: 53.3190, lon: -3.4920 },
      { name: "Colwyn Bay", nameCy: "Bae Colwyn", lat: 53.2947, lon: -3.7269 },
      { name: "Holyhead", nameCy: "Caergybi", lat: 53.3094, lon: -4.6331 },
      { name: "Conwy", nameCy: "Conwy", lat: 53.2804, lon: -3.8265 },
      { name: "Porthmadog", nameCy: "Porthmadog", lat: 52.9293, lon: -4.1314 },
      { name: "Llanelli", nameCy: "Llanelli", lat: 51.6806, lon: -4.1615 },
      { name: "Neath", nameCy: "Castell-nedd", lat: 51.6631, lon: -3.8047 }
    ];

    let lang = 'en';
    let allResults = [];
    let map, markers = [];
    let featured = null;

    const codes = {
      0: { en: "Clear", cy: "Glir", icon: "☀️" },
      1: { en: "Mostly clear", cy: "Yn bennaf glir", icon: "🌤️" },
      2: { en: "Partly cloudy", cy: "Cymylog yn rhannol", icon: "⛅" },
      3: { en: "Cloudy", cy: "Cwmwlog", icon: "☁️" },
      61: { en: "Rain", cy: "Glaw", icon: "🌧️" },
      95: { en: "Thunderstorm", cy: "Storm", icon: "⛈️" }
    };
    function desc(code) { return codes[code] || { en: "Cloudy", cy: "Cwmwlog", icon: "☁️" }; }

    function initMap() {
      map = L.map('map').setView([52.3, -3.8], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
    }

    function updateMarkers(data) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      data.forEach(c => {
        const m = L.marker([c.lat, c.lon]).addTo(map);
        m.bindPopup(`<b>${lang==='en'?c.name:c.nameCy}</b><br>${c.temp}° ${c.desc.icon}`);
        m.on('click', () => setFeatured(c));
        markers.push(m);
      });
    }

    async function load() {
      document.getElementById('weatherGrid').innerHTML = '<p class="text-gray-500">Loading...</p>';
      const results = await Promise.all(cities.map(async city => {
        try {
          const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=Europe/London`);
          const d = await r.json();
          const cur = d.current;
          const hourly = d.hourly.time.slice(0, 24).map((t, i) => ({
            time: new Date(t).getHours(),
            temp: Math.round(d.hourly.temperature_2m[i]),
            code: d.hourly.weather_code[i]
          }));
          return { ...city, temp: Math.round(cur.temperature_2m), wind: Math.round(cur.wind_speed_10m), desc: desc(cur.weather_code), hourly };
        } catch {
          return { ...city, temp: "--", wind: "--", desc: { en: "N/A", cy: "N/A", icon: "⚠️" }, hourly: [] };
        }
      }));
      allResults = results;
      setFeatured(results[0]);
      renderList(results);
      updateMarkers(results);
    }

    function setFeatured(c) {
      featured = c;
      document.getElementById('current').innerHTML = `
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-3xl font-bold">${lang==='en'?c.name:c.nameCy}</h2>
            <p class="text-gray-500 text-sm">${lang==='en'?c.nameCy:c.name}</p>
            <div class="text-7xl font-light my-2">${c.temp}°</div>
            <p class="text-lg">${lang==='en'?c.desc.en:c.desc.cy}</p>
            <p class="text-sm text-gray-500 mt-1"><i class="fas fa-wind"></i> ${c.wind} km/h</p>
          </div>
          <div class="text-8xl">${c.desc.icon}</div>
        </div>`;
      document.getElementById('hourly').innerHTML = (c.hourly || []).slice(0, 12).map(h => `
        <div class="text-center min-w-[70px]">
          <div class="text-sm text-gray-500">${h.time}:00</div>
          <div class="text-2xl my-1">${desc(h.code).icon}</div>
          <div class="font-semibold">${h.temp}°</div>
        </div>
      `).join('');
    }

    function renderList(data) {
      document.getElementById('weatherGrid').innerHTML = data.map(c => `
        <div class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0 cursor-pointer hover:bg-gray-50 px-2 rounded" onclick='setFeatured(${JSON.stringify(c)})'>
          <div class="flex items-center gap-4">
            <span class="text-3xl">${c.desc.icon}</span>
            <div>
              <div class="font-medium">${lang==='en'?c.name:c.nameCy}</div>
              <div class="text-sm text-gray-500">${lang==='en'?c.desc.en:c.desc.cy}</div>
            </div>
          </div>
          <div class="text-2xl font-light">${c.temp}°</div>
        </div>
      `).join('');
    }

    function filterCities() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const f = allResults.filter(c => c.name.toLowerCase().includes(q) || c.nameCy.toLowerCase().includes(q));
      if (f.length) setFeatured(f[0]);
      renderList(f);
      updateMarkers(f);
    }

    function toggleLang() {
      lang = lang === 'en' ? 'cy' : 'en';
      document.getElementById('langLabel').textContent = lang === 'en' ? 'Cymraeg' : 'English';
      if (featured) setFeatured(featured);
      filterCities();
    }

    initMap();
    load();
  </script>
</body>
</html>
