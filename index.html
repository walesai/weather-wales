<!DOCTYPE html>
<html lang="en" class="transition-colors duration-500">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather.wales | Tywydd Cymru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-from: #e0f2fe;
      --bg-to: #fefce8;
      --text: #1e293b;
      --glass: rgba(255,255,255,0.85);
      --accent: #0284c7;
    }
    html.dark {
      --bg-from: #0f172a;
      --bg-to: #1e293b;
      --text: #f1f5f9;
      --glass: rgba(30,41,59,0.85);
      --accent: #38bdf8;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-to) 100%);
      color: var(--text);
      min-height: 100vh;
      transition: background 1s ease;
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    html.dark .glass {
      border-color: rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .temp-glow { text-shadow: 0 6px 40px rgba(14, 165, 233, 0.5); }
    .card-hover { transition: all 0.25s ease; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 12px 30px -8px rgb(0 0 0 / 0.15); }

    /* Animations */
    .rain { position: relative; overflow: hidden; }
    .rain::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(transparent, transparent 10px, rgba(255,255,255,0.15) 10px, rgba(255,255,255,0.15) 12px);
      animation: rain 0.6s linear infinite;
      pointer-events: none;
    }
    @keyframes rain { from { transform: translateY(-20px); } to { transform: translateY(20px); } }
    .sun-rays {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.7; transform: scale(1.05); } }

    /* Dark mode toggle */
    .toggle-btn { transition: all 0.2s; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="glass sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl dragon">🏴󠁧󠁢󠁷󠁬󠁳󠁿</span>
        <div>
          <span class="font-extrabold text-2xl bg-gradient-to-r from-sky-600 to-red-600 bg-clip-text text-transparent">weather.wales</span>
          <p class="text-xs opacity-70 -mt-1">Tywydd Cymru • Cymru Weather</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleLang()" class="px-4 py-2 rounded-full bg-sky-100 dark:bg-slate-700 text-sky-700 dark:text-sky-300 text-sm font-semibold hover:bg-sky-200 transition">
          <span id="langLabel">Cymraeg</span>
        </button>
        <button onclick="toggleDark()" class="toggle-btn w-10 h-10 rounded-full glass flex items-center justify-center text-lg" title="Dark mode">
          <span id="darkIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Search -->
  <div class="max-w-2xl mx-auto px-4 py-6">
    <div class="relative">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input id="searchInput" type="text" placeholder="Search any town or city in Wales / Chwilio tref neu ddinas..."
             class="w-full pl-12 pr-6 py-4 rounded-2xl glass shadow-lg text-lg focus:outline-none focus:ring-4 focus:ring-sky-300 dark:focus:ring-sky-600 transition"
             oninput="filterCities()">
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 pb-12">
    <div class="grid lg:grid-cols-3 gap-6">
      <!-- Main column -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Current -->
        <div id="current" class="glass rounded-3xl p-8 shadow-xl relative overflow-hidden">
          Loading current conditions...
        </div>

        <!-- Hourly -->
        <div class="glass rounded-3xl p-6 shadow-lg">
          <h3 class="font-bold text-lg mb-4">Hourly Forecast • Rhagolwg Awr</h3>
          <div id="hourly" class="flex gap-3 overflow-x-auto pb-2"></div>
        </div>

        <!-- 10-Day -->
        <div class="glass rounded-3xl p-6 shadow-lg">
          <h3 class="font-bold text-lg mb-4">10-Day Forecast • Rhagolwg 10 Diwrnod</h3>
          <div id="daily" class="space-y-2"></div>
        </div>

        <!-- Map -->
        <div class="glass rounded-3xl overflow-hidden shadow-lg">
          <div id="map" class="h-96"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="glass rounded-3xl p-6 shadow-lg">
        <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
          <span>Locations across Wales</span>
          <span class="text-xl">🐉</span>
        </h3>
        <div id="weatherGrid" class="space-y-1 max-h-[800px] overflow-y-auto pr-2"></div>
      </div>
    </div>
  </main>

  <footer class="text-center py-8 text-sm opacity-70">
    weather.wales • Live data from Open-Meteo • Made with ❤️ for Cymru 🏴󠁧󠁢󠁷󠁬󠁳󠁿
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const cities = [
      { name: "Cardiff", nameCy: "Caerdydd", lat: 51.4816, lon: -3.1791 },
      { name: "Swansea", nameCy: "Abertawe", lat: 51.6214, lon: -3.9436 },
      { name: "Newport", nameCy: "Casnewydd", lat: 51.5842, lon: -2.9977 },
      { name: "Bangor", nameCy: "Bangor", lat: 53.2274, lon: -4.1293 },
      { name: "Aberystwyth", nameCy: "Aberystwyth", lat: 52.4153, lon: -4.0829 },
      { name: "Wrexham", nameCy: "Wrecsam", lat: 53.0430, lon: -2.9930 },
      { name: "Caernarfon", nameCy: "Caernarfon", lat: 53.1413, lon: -4.2702 },
      { name: "Llandudno", nameCy: "Llandudno", lat: 53.3240, lon: -3.8274 },
      { name: "Haverfordwest", nameCy: "Hwlffordd", lat: 51.8017, lon: -4.9691 },
      { name: "Carmarthen", nameCy: "Caerfyrddin", lat: 51.8560, lon: -4.3095 },
      { name: "Barry", nameCy: "Y Barri", lat: 51.3998, lon: -3.2838 },
      { name: "Bridgend", nameCy: "Pen-y-bont ar Ogwr", lat: 51.5045, lon: -3.5769 },
      { name: "Merthyr Tydfil", nameCy: "Merthyr Tudful", lat: 51.7476, lon: -3.3778 },
      { name: "Pontypridd", nameCy: "Pontypridd", lat: 51.6018, lon: -3.3421 },
      { name: "Caerphilly", nameCy: "Caerffili", lat: 51.5745, lon: -3.2180 },
      { name: "Brecon", nameCy: "Aberhonddu", lat: 51.9461, lon: -3.3886 },
      { name: "Cardigan", nameCy: "Aberteifi", lat: 52.0837, lon: -4.6602 },
      { name: "Tenby", nameCy: "Dinbych-y-pysgod", lat: 51.6728, lon: -4.7061 },
      { name: "Rhyl", nameCy: "Y Rhyl", lat: 53.3190, lon: -3.4920 },
      { name: "Colwyn Bay", nameCy: "Bae Colwyn", lat: 53.2947, lon: -3.7269 },
      { name: "Holyhead", nameCy: "Caergybi", lat: 53.3094, lon: -4.6331 },
      { name: "Conwy", nameCy: "Conwy", lat: 53.2804, lon: -3.8265 },
      { name: "Porthmadog", nameCy: "Porthmadog", lat: 52.9293, lon: -4.1314 },
      { name: "Llanelli", nameCy: "Llanelli", lat: 51.6806, lon: -4.1615 },
      { name: "Neath", nameCy: "Castell-nedd", lat: 51.6631, lon: -3.8047 },
      { name: "Port Talbot", nameCy: "Port Talbot", lat: 51.5924, lon: -3.7802 },
      { name: "Cwmbran", nameCy: "Cwmbrân", lat: 51.6544, lon: -3.0228 },
      { name: "Ebbw Vale", nameCy: "Glynebwy", lat: 51.7775, lon: -3.2075 },
      { name: "Newtown", nameCy: "Y Drenewydd", lat: 52.5140, lon: -3.3145 },
      { name: "Welshpool", nameCy: "Y Trallwng", lat: 52.6601, lon: -3.1474 }
    ];

    let lang = 'en';
    let allResults = [];
    let map, markers = [];
    let featured = null;
    let darkMode = false;

    const codes = {
      0: { en: "Clear sky", cy: "Awyr glir", icon: "☀️", anim: "sun" },
      1: { en: "Mostly clear", cy: "Yn bennaf glir", icon: "🌤️", anim: "sun" },
      2: { en: "Partly cloudy", cy: "Cymylog yn rhannol", icon: "⛅", anim: "cloud" },
      3: { en: "Overcast", cy: "Cwmwlog", icon: "☁️", anim: "cloud" },
      45: { en: "Fog", cy: "Niwl", icon: "🌫️", anim: "fog" },
      61: { en: "Rain", cy: "Glaw", icon: "🌧️", anim: "rain" },
      63: { en: "Heavy rain", cy: "Glaw trwm", icon: "🌧️", anim: "rain" },
      71: { en: "Snow", cy: "Eira", icon: "❄️", anim: "snow" },
      95: { en: "Thunderstorm", cy: "Storm", icon: "⛈️", anim: "rain" }
    };
    function desc(code) { return codes[code] || { en: "Cloudy", cy: "Cwmwlog", icon: "☁️", anim: "cloud" }; }

    function setWeatherTheme(anim) {
      const body = document.body;
      body.classList.remove('rain', 'sun-rays');
      if (anim === 'rain') body.classList.add('rain');
      if (anim === 'sun') body.classList.add('sun-rays');

      const root = document.documentElement;
      if (anim === 'sun') {
        root.style.setProperty('--bg-from', darkMode ? '#1e1b4b' : '#fef08a');
        root.style.setProperty('--bg-to', darkMode ? '#0f172a' : '#fdba74');
        root.style.setProperty('--accent', darkMode ? '#fbbf24' : '#f59e0b');
      } else if (anim === 'rain') {
        root.style.setProperty('--bg-from', darkMode ? '#1e3a8a' : '#93c5fd');
        root.style.setProperty('--bg-to', darkMode ? '#0f172a' : '#60a5fa');
        root.style.setProperty('--accent', '#3b82f6');
      } else if (anim === 'snow') {
        root.style.setProperty('--bg-from', darkMode ? '#1e293b' : '#e0f2fe');
        root.style.setProperty('--bg-to', darkMode ? '#0f172a' : '#f0f9ff');
        root.style.setProperty('--accent', '#64748b');
      } else {
        root.style.setProperty('--bg-from', darkMode ? '#0f172a' : '#e0f2fe');
        root.style.setProperty('--bg-to', darkMode ? '#1e293b' : '#fefce8');
        root.style.setProperty('--accent', darkMode ? '#38bdf8' : '#0284c7');
      }
    }

    function initMap() {
      map = L.map('map').setView([52.3, -3.8], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
    }

    function updateMarkers(data) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      data.forEach(c => {
        const m = L.marker([c.lat, c.lon]).addTo(map);
        m.bindPopup(`<strong>${lang==='en'?c.name:c.nameCy}</strong><br>${c.temp}° ${c.desc.icon}`);
        m.on('click', () => setFeatured(c));
        markers.push(m);
      });
    }

    async function load() {
      document.getElementById('weatherGrid').innerHTML = '<p class="opacity-60">Loading live weather for Cymru...</p>';
      const results = await Promise.all(cities.map(async city => {
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe/London&forecast_days=10`;
          const r = await fetch(url);
          const d = await r.json();
          const cur = d.current;
          const hourly = d.hourly.time.slice(0, 24).map((t, i) => ({
            hour: new Date(t).getHours(),
            temp: Math.round(d.hourly.temperature_2m[i]),
            code: d.hourly.weather_code[i]
          }));
          const daily = d.daily.time.slice(0, 10).map((t, i) => ({
            day: new Date(t).toLocaleDateString(lang === 'cy' ? 'cy-GB' : 'en-GB', { weekday: 'short' }),
            max: Math.round(d.daily.temperature_2m_max[i]),
            min: Math.round(d.daily.temperature_2m_min[i]),
            code: d.daily.weather_code[i]
          }));
          return { ...city, temp: Math.round(cur.temperature_2m), wind: Math.round(cur.wind_speed_10m), desc: desc(cur.weather_code), hourly, daily };
        } catch {
          return { ...city, temp: "--", wind: "--", desc: { en: "Unavailable", cy: "Ddim ar gael", icon: "⚠️", anim: "cloud" }, hourly: [], daily: [] };
        }
      }));
      allResults = results;
      setFeatured(results[0]);
      renderList(results);
      updateMarkers(results);
    }

    function setFeatured(c) {
      featured = c;
      setWeatherTheme(c.desc.anim || 'cloud');
      const name = lang === 'en' ? c.name : c.nameCy;
      const other = lang === 'en' ? c.nameCy : c.name;
      document.getElementById('current').innerHTML = `
        <div class="flex items-center justify-between relative z-10">
          <div>
            <h1 class="text-4xl md:text-5xl font-extrabold">${name}</h1>
            <p class="opacity-70">${other}</p>
            <div class="text-8xl font-light temp-glow my-4" style="color: var(--accent)">${c.temp}°</div>
            <p class="text-2xl font-medium">${lang==='en'?c.desc.en:c.desc.cy}</p>
            <p class="text-sm opacity-70 mt-2">💨 ${c.wind} km/h</p>
          </div>
          <div class="text-9xl ${c.desc.anim === 'sun' ? 'sun-rays' : ''}">${c.desc.icon}</div>
        </div>`;

      document.getElementById('hourly').innerHTML = (c.hourly || []).slice(0, 12).map(h => `
        <div class="text-center min-w-[72px] glass rounded-xl p-3 flex-shrink-0">
          <div class="text-xs opacity-70">${h.hour}:00</div>
          <div class="text-3xl my-1">${desc(h.code).icon}</div>
          <div class="font-bold" style="color: var(--accent)">${h.temp}°</div>
        </div>
      `).join('');

      document.getElementById('daily').innerHTML = (c.daily || []).map(d => `
        <div class="flex items-center justify-between py-2 border-b border-slate-200 dark:border-slate-700 last:border-0">
          <span class="font-medium w-16">${d.day}</span>
          <span class="text-2xl">${desc(d.code).icon}</span>
          <span class="text-sm opacity-70">${d.min}°</span>
          <div class="flex-1 mx-4 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-blue-400 to-red-400 rounded-full" style="width: ${Math.min(100, (d.max - d.min + 10) * 4)}%"></div>
          </div>
          <span class="font-semibold">${d.max}°</span>
        </div>
      `).join('');
    }

    function renderList(data) {
      document.getElementById('weatherGrid').innerHTML = data.map(c => `
        <div class="card-hover flex items-center justify-between py-3 px-3 hover:bg-white/50 dark:hover:bg-slate-700/50 rounded-xl cursor-pointer" onclick='setFeatured(${JSON.stringify(c)})'>
          <div class="flex items-center gap-3">
            <span class="text-3xl">${c.desc.icon}</span>
            <div>
              <div class="font-semibold">${lang==='en'?c.name:c.nameCy}</div>
              <div class="text-xs opacity-60">${lang==='en'?c.desc.en:c.desc.cy}</div>
            </div>
          </div>
          <div class="text-2xl font-light" style="color: var(--accent)">${c.temp}°</div>
        </div>
      `).join('');
    }

    function filterCities() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const f = allResults.filter(c => c.name.toLowerCase().includes(q) || c.nameCy.toLowerCase().includes(q));
      if (f.length) setFeatured(f[0]);
      renderList(f);
      updateMarkers(f);
    }

    function toggleLang() {
      lang = lang === 'en' ? 'cy' : 'en';
      document.getElementById('langLabel').textContent = lang === 'en' ? 'Cymraeg' : 'English';
      if (featured) setFeatured(featured);
      filterCities();
    }

    function toggleDark() {
      darkMode = !darkMode;
      document.documentElement.classList.toggle('dark', darkMode);
      document.getElementById('darkIcon').textContent = darkMode ? '☀️' : '🌙';
      if (featured) setWeatherTheme(featured.desc.anim || 'cloud');
    }

    initMap();
    load();
  </script>
</body>
</html>
