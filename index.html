<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather.wales | Tywydd Cymru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
    .welsh-accent { background: linear-gradient(135deg, #c8102e, #006400); }
    .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5); }
  </style>
</head>
<body class="gradient-bg text-white min-h-screen">
  <!-- Header -->
  <header class="welsh-accent py-6 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="text-5xl">🏴󠁧󠁢󠁷󠁬󠁳󠁿</span>
        <div>
          <h1 class="text-4xl font-extrabold tracking-tight">weather.wales</h1>
          <p class="text-sm opacity-90" data-en="Wales Weather" data-cy="Tywydd Cymru">Wales Weather</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button id="langBtn" onclick="toggleLang()" class="bg-white/20 hover:bg-white/30 px-5 py-2 rounded-full font-semibold text-sm transition">
          <span id="langLabel">Cymraeg</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="py-16 text-center">
    <h2 class="text-5xl md:text-6xl font-extrabold mb-4" data-en="Weather Across Cymru" data-cy="Tywydd ar Draws Cymru">Weather Across Cymru</h2>
    <p class="text-xl text-slate-300 max-w-2xl mx-auto" data-en="Live forecasts across Wales — from the south coast to the mountains of the north. Simple, beautiful, and memorable." data-cy="Rhagolygon byw ar draws Cymru — o arfordir y de i fynyddoedd y gogledd. Syml, hardd, a chofiadwy.">
      Live forecasts across Wales — from the south coast to the mountains of the north. Simple, beautiful, and memorable.
    </p>
  </section>

  <!-- Search -->
  <div class="max-w-2xl mx-auto px-6 pb-8">
    <input id="searchInput" type="text" placeholder="Search any town or city..." 
           class="w-full px-6 py-4 rounded-2xl bg-slate-800/80 border border-white/10 text-white text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
           oninput="filterCities()">
  </div>

  <!-- Cities Grid -->
  <div class="max-w-7xl mx-auto px-6 pb-16">
    <div id="weatherGrid" class="space-y-12">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-950 py-10 text-center text-slate-400 text-sm">
    <p data-en="weather.wales • Live data via Open-Meteo • Made for Cymru" data-cy="weather.wales • Data byw trwy Open-Meteo • Wedi'i wneud i Gymru">
      weather.wales • Live data via Open-Meteo • Made for Cymru
    </p>
  </footer>

  <script>
    const cities = [
      // South Wales
      { name: "Cardiff", nameCy: "Caerdydd", lat: 51.4816, lon: -3.1791 },
      { name: "Swansea", nameCy: "Abertawe", lat: 51.6214, lon: -3.9436 },
      { name: "Newport", nameCy: "Casnewydd", lat: 51.5842, lon: -2.9977 },
      { name: "Barry", nameCy: "Y Barri", lat: 51.3998, lon: -3.2838 },
      { name: "Bridgend", nameCy: "Pen-y-bont ar Ogwr", lat: 51.5045, lon: -3.5769 },
      { name: "Merthyr Tydfil", nameCy: "Merthyr Tudful", lat: 51.7476, lon: -3.3778 },
      { name: "Pontypridd", nameCy: "Pontypridd", lat: 51.6018, lon: -3.3421 },
      { name: "Caerphilly", nameCy: "Caerffili", lat: 51.5745, lon: -3.2180 },
      { name: "Cwmbran", nameCy: "Cwmbrân", lat: 51.6544, lon: -3.0228 },
      { name: "Ebbw Vale", nameCy: "Glynebwy", lat: 51.7775, lon: -3.2075 },
      // Mid Wales
      { name: "Aberystwyth", nameCy: "Aberystwyth", lat: 52.4153, lon: -4.0829 },
      { name: "Brecon", nameCy: "Aberhonddu", lat: 51.9461, lon: -3.3886 },
      { name: "Newtown", nameCy: "Y Drenewydd", lat: 52.5140, lon: -3.3145 },
      { name: "Welshpool", nameCy: "Y Trallwng", lat: 52.6601, lon: -3.1474 },
      { name: "Machynlleth", nameCy: "Machynlleth", lat: 52.5905, lon: -3.8518 },
      { name: "Llandrindod Wells", nameCy: "Llandrindod", lat: 52.2411, lon: -3.3784 },
      // West Wales
      { name: "Carmarthen", nameCy: "Caerfyrddin", lat: 51.8560, lon: -4.3095 },
      { name: "Haverfordwest", nameCy: "Hwlffordd", lat: 51.8017, lon: -4.9691 },
      { name: "Cardigan", nameCy: "Aberteifi", lat: 52.0837, lon: -4.6602 },
      { name: "Tenby", nameCy: "Dinbych-y-pysgod", lat: 51.6728, lon: -4.7061 },
      { name: "Pembroke", nameCy: "Penfro", lat: 51.6761, lon: -4.9147 },
      { name: "Fishguard", nameCy: "Abergwaun", lat: 51.9939, lon: -4.9761 },
      // North Wales
      { name: "Bangor", nameCy: "Bangor", lat: 53.2274, lon: -4.1293 },
      { name: "Wrexham", nameCy: "Wrecsam", lat: 53.0430, lon: -2.9930 },
      { name: "Caernarfon", nameCy: "Caernarfon", lat: 53.1413, lon: -4.2702 },
      { name: "Llandudno", nameCy: "Llandudno", lat: 53.3240, lon: -3.8274 },
      { name: "Conwy", nameCy: "Conwy", lat: 53.2804, lon: -3.8265 },
      { name: "Holyhead", nameCy: "Caergybi", lat: 53.3094, lon: -4.6331 },
      { name: "Rhyl", nameCy: "Y Rhyl", lat: 53.3190, lon: -3.4920 },
      { name: "Colwyn Bay", nameCy: "Bae Colwyn", lat: 53.2947, lon: -3.7269 },
      { name: "Porthmadog", nameCy: "Porthmadog", lat: 52.9293, lon: -4.1314 },
      { name: "Bala", nameCy: "Y Bala", lat: 52.9111, lon: -3.5972 }
    ];

    const regions = {
      "South Wales": ["Cardiff", "Swansea", "Newport", "Barry", "Bridgend", "Merthyr Tydfil", "Pontypridd", "Caerphilly", "Cwmbran", "Ebbw Vale"],
      "Mid Wales": ["Aberystwyth", "Brecon", "Newtown", "Welshpool", "Machynlleth", "Llandrindod Wells"],
      "West Wales": ["Carmarthen", "Haverfordwest", "Cardigan", "Tenby", "Pembroke", "Fishguard"],
      "North Wales": ["Bangor", "Wrexham", "Caernarfon", "Llandudno", "Conwy", "Holyhead", "Rhyl", "Colwyn Bay", "Porthmadog", "Bala"]
    };

    let lang = 'en';
    let allResults = [];

    const weatherCodes = {
      0: { en: "Clear sky", cy: "Awyr glir", icon: "☀️" },
      1: { en: "Mainly clear", cy: "Yn bennaf glir", icon: "🌤️" },
      2: { en: "Partly cloudy", cy: "Cymylog yn rhannol", icon: "⛅" },
      3: { en: "Overcast", cy: "Cwmwlog", icon: "☁️" },
      45: { en: "Fog", cy: "Niwl", icon: "🌫️" },
      48: { en: "Depositing rime fog", cy: "Niwl rhewllyd", icon: "🌫️" },
      51: { en: "Light drizzle", cy: "Glaw mân ysgafn", icon: "🌦️" },
      61: { en: "Slight rain", cy: "Glaw ysgafn", icon: "🌧️" },
      63: { en: "Moderate rain", cy: "Glaw cymedrol", icon: "🌧️" },
      65: { en: "Heavy rain", cy: "Glaw trwm", icon: "⛈️" },
      71: { en: "Slight snow", cy: "Eira ysgafn", icon: "🌨️" },
      80: { en: "Slight rain showers", cy: "Cawodydd glaw ysgafn", icon: "🌦️" },
      95: { en: "Thunderstorm", cy: "Storm mellt", icon: "⛈️" }
    };

    function getWeatherDesc(code) {
      return weatherCodes[code] || { en: "Unknown", cy: "Anhysbys", icon: "❓" };
    }

    async function loadWeather() {
      const grid = document.getElementById('weatherGrid');
      grid.innerHTML = '<div class="text-center py-12 text-2xl">Loading live weather...</div>';

      const promises = cities.map(async (city) => {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe/London`);
          const data = await res.json();
          const current = data.current;
          const desc = getWeatherDesc(current.weather_code);
          return { ...city, temp: Math.round(current.temperature_2m), wind: Math.round(current.wind_speed_10m), desc };
        } catch (e) {
          return { ...city, temp: "--", wind: "--", desc: { en: "Unavailable", cy: "Ddim ar gael", icon: "⚠️" } };
        }
      });

      allResults = await Promise.all(promises);
      renderRegions(allResults);
    }

    function renderRegions(data) {
      const grid = document.getElementById('weatherGrid');
      let html = '';
      for (const [region, names] of Object.entries(regions)) {
        const regionCities = data.filter(c => names.includes(c.name));
        if (regionCities.length === 0) continue;
        html += `<div>
          <h3 class="text-3xl font-bold mb-6 text-emerald-400">${region}</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            ${regionCities.map(city => `
              <div class="card bg-slate-800/80 backdrop-blur rounded-3xl overflow-hidden border border-white/10">
                <div class="p-8">
                  <div class="flex justify-between items-start mb-4">
                    <div>
                      <h3 class="text-2xl font-bold">${lang === 'en' ? city.name : city.nameCy}</h3>
                      <p class="text-slate-400 text-sm">${lang === 'en' ? city.nameCy : city.name}</p>
                    </div>
                    <span class="text-5xl">${city.desc.icon}</span>
                  </div>
                  <div class="text-6xl font-extrabold mb-2">${city.temp}°C</div>
                  <p class="text-xl text-emerald-300 mb-4">${lang === 'en' ? city.desc.en : city.desc.cy}</p>
                  <div class="flex gap-6 text-sm text-slate-400">
                    <div><i class="fas fa-wind mr-2"></i>${city.wind} km/h</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>`;
      }
      grid.innerHTML = html || '<div class="text-center py-12 text-slate-400">No matches found.</div>';
    }

    function filterCities() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allResults.filter(c => 
        c.name.toLowerCase().includes(query) || c.nameCy.toLowerCase().includes(query)
      );
      renderRegions(filtered);
    }

    function toggleLang() {
      lang = lang === 'en' ? 'cy' : 'en';
      document.getElementById('langLabel').textContent = lang === 'en' ? 'Cymraeg' : 'English';
      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = lang === 'en' ? el.dataset.en : el.dataset.cy;
      });
      filterCities();
    }

    loadWeather();
  </script>
</body>
</html>
